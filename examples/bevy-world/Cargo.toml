[package]
name = "reverse-bevy-world"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[[bin]]
name = "reverse-bevy-world"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["default_app", "2d_bevy_render", "bevy_winit", "default_font"] }
reverse-bevy = { path = "../../crates/bevy" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["multi_threaded", "x11"] }
reverse-bevy = { path = "../../crates/bevy", features = ["file_watcher"] }
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["web", "webgl2"] }
wasm-bindgen = "0.2"

[profile.dev]
debug = 0

[profile.browser]
inherits = "release"
opt-level = "s"
